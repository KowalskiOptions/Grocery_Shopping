                            <select onchange="updateStoreColorInline('${store.id}', this.value)" class="bg-white border border-stone-300 rounded-xl px-2.5 py-1 text-xs text-stone-800 font-semibold focus:outline-none transition">
                                ${sophisticatedColors.map(c => `<option value="${c.value}" ${store.themeColor === c.value ? 'selected' : ''}>${c.name}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateStoreNameInline(storeId, newName) {
            const val = newName.trim();
            if (!val) return;
            const store = db.stores.find(s => s.id === storeId);
            if (store) {
                store.name = val;
                saveLocalData();
            }
        }

        function updateStoreColorInline(storeId, colorVal) {
            const store = db.stores.find(s => s.id === storeId);
            if (store) {
                store.themeColor = colorVal;
                saveLocalData();
                renderManageStoresList();
            }
        }

        function moveStoreOrder(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= db.stores.length) return;
            const tmp = db.stores[idx];
            db.stores[idx] = db.stores[target];
            db.stores[target] = tmp;
            saveLocalData();
            renderManageStoresList();
        }

        function confirmDeleteStore(storeId) {
            openConfirmModal("Delete Store", "Are you sure you want to delete this store?", () => {
                db.stores = db.stores.filter(s => s.id !== storeId);
                delete db.carts[storeId];
                delete storeItemQuantities[storeId];
                db.items.forEach(i => { if (i.stores) i.stores = i.stores.filter(id => id !== storeId); });
                saveLocalData();
                if (activeStoreId === storeId) switchView('master'); else renderAll();
            });
        }

        function promptAddCategory() {
            const name = prompt("Enter category name:");
            if (name?.trim()) {
                const val = name.trim();
                const exists = db.categories.some(c => c.toLowerCase() === val.toLowerCase());
                if (exists) {
                    alert('This category already exists.');
                    return;
                }
                db.categories.push(val);
                saveLocalData();
                renderAll();
            }
        }

        function promptEditCategory(idx) {
            const oldCat = db.categories[idx];
            const name = prompt("Edit category name:", oldCat);
            if (name?.trim() && name.trim() !== oldCat) {
                const newCat = name.trim();
                const exists = db.categories.some((c, i) => i !== idx && c.toLowerCase() === newCat.toLowerCase());
                if (exists) {
                    alert('Another category with this name already exists.');
                    return;
                }
                db.categories[idx] = newCat;
                db.items.forEach(i => { 
                    if (i.category === oldCat) i.category = newCat; 
                });
                saveLocalData();
                renderAll();
            }
        }

        function confirmDeleteCategory(idx) {
            const cat = db.categories[idx];
            openConfirmModal("Delete Category", `Delete category "${cat}"? Items will be set to Uncategorized.`, () => {
                db.categories.splice(idx, 1);
                db.items.forEach(i => { if (i.category === cat) i.category = ''; });
                saveLocalData();
                renderAll();
            });
        }

        function promptAddUnit() {
            const name = prompt("Enter measurement unit:");
            if (name?.trim()) {
                const val = name.trim();
                const exists = db.units.some(u => u.toLowerCase() === val.toLowerCase());
                if (exists) {
                    alert('This unit already exists.');
                    return;
                }
                db.units.push(val);
                saveLocalData();
                renderAll();
            }
        }

        function promptEditUnit(idx) {
            const oldUnit = db.units[idx];
            const name = prompt("Edit unit name:", oldUnit);
            if (name?.trim() && name.trim() !== oldUnit) {
                const newUnit = name.trim();
                const exists = db.units.some((u, i) => i !== idx && u.toLowerCase() === newUnit.toLowerCase());
                if (exists) {
                    alert('Another unit with this name already exists.');
                    return;
                }
                db.units[idx] = newUnit;
                db.items.forEach(i => { 
                    if (i.unit === oldUnit) i.unit = newUnit; 
                });
                saveLocalData();
                renderAll();
            }
        }

        function confirmDeleteUnit(idx) {
            const unit = db.units[idx];
            openConfirmModal("Delete Unit", `Delete unit "${unit}"?`, () => {
                db.units.splice(idx, 1);
                db.items.forEach(i => { if (i.unit === unit) i.unit = ''; });
                saveLocalData();
                renderAll();
            });
        }

        // Cart & Quantity Actions
        function adjustStoreItemQty(itemId, storeId, change) {
            if (!storeItemQuantities[storeId]) storeItemQuantities[storeId] = {};
            if (storeItemQuantities[storeId][itemId] === undefined) {
                storeItemQuantities[storeId][itemId] = 1;
            }
            let current = storeItemQuantities[storeId][itemId] + change;
            if (current < 1) current = 1;
            storeItemQuantities[storeId][itemId] = current;

            if (db.carts[storeId]?.[itemId]) {
                db.carts[storeId][itemId].quantity = current;
                saveLocalData();
            }
            renderAll();
        }

        function toggleCartItem(itemId, storeId) {
            if (!db.carts[storeId]) db.carts[storeId] = {};
            if (!storeItemQuantities[storeId]) storeItemQuantities[storeId] = {};
            
            if (db.carts[storeId][itemId]) {
                delete db.carts[storeId][itemId];
                storeItemQuantities[storeId][itemId] = 1;
            } else {
                const qty = storeItemQuantities[storeId][itemId] !== undefined ? storeItemQuantities[storeId][itemId] : 1;
                db.carts[storeId][itemId] = { quantity: qty, checked: false };
            }
            saveLocalData();
            renderAll();
        }

        function toggleCartCheck(itemId, storeId) {
            if (!db.carts[storeId]?.[itemId]) return;
            db.carts[storeId][itemId].checked = !db.carts[storeId][itemId].checked;
            saveLocalData();
            renderAll();
        }

        function confirmDeleteStoreItem(itemId, storeId) {
            openConfirmModal("Remove Item", "Remove item from store list?", () => {
                const item = db.items.find(i => i.id === itemId);
                if (item?.stores) item.stores = item.stores.filter(id => id !== storeId);
                if (db.carts[storeId]) delete db.carts[storeId][itemId];
                if (storeItemQuantities[storeId]) storeItemQuantities[storeId][itemId] = 1;
                saveLocalData();
                renderAll();
            });
        }

        function confirmDeleteMasterItem(itemId) {
            openConfirmModal("Delete Item", "Are you sure you want to completely delete this item from the full list?", () => {
                db.items = db.items.filter(i => i.id !== itemId);
                Object.keys(db.carts).forEach(sId => { if (db.carts[sId][itemId]) delete db.carts[sId][itemId]; });
                Object.keys(storeItemQuantities).forEach(sId => { if (storeItemQuantities[sId][itemId]) storeItemQuantities[sId][itemId] = 1; });
                saveLocalData();
                renderAll();
            });
        }

        function confirmDeleteCartItem(itemId, storeId) {
            openConfirmModal("Remove from Shopping List", "Remove item from shopping list and reset quantity to 1?", () => {
                if (db.carts[storeId]) delete db.carts[storeId][itemId];
                if (storeItemQuantities[storeId]) storeItemQuantities[storeId][itemId] = 1;
                saveLocalData();
                renderAll();
            });
        }

        function clearPurchasedItems(storeId) {
            openConfirmModal("Clear Purchased Items", "Remove all checked items from shopping list and reset their quantities to 1?", () => {
                const cartData = db.carts[storeId] || {};
                Object.keys(cartData).forEach(itemId => {
                    if (cartData[itemId].checked) {
                        delete cartData[itemId];
                        if (storeItemQuantities[storeId]) {
                            storeItemQuantities[storeId][itemId] = 1;
                        }
                    }
                });
                saveLocalData();
                renderAll();
            });
        }

        function clearCart(storeId) {
            openConfirmModal("Clear ALL Items", "Clear all items from shopping list and reset quantities to 1?", () => { 
                db.carts[storeId] = {}; 
                if (storeItemQuantities[storeId]) {
                    Object.keys(storeItemQuantities[storeId]).forEach(k => storeItemQuantities[storeId][k] = 1);
                }
                saveLocalData(); 
                renderAll(); 
            });
        }

        // Read-only Item Details Modal for Shopping List
        function openReadOnlyItemModal(itemId, storeId = null) {
            const modal = document.getElementById('itemDetailModal');
            const titleEl = document.getElementById('itemModalTitle');
            const bodyEl = document.getElementById('itemDetailBody');
            const footerEl = document.getElementById('itemModalFooter');

            const item = db.items.find(i => i.id === itemId);
            if (!item) return;

            titleEl.textContent = 'Item Details';
            
            let effectiveBrandArr = item.brandOrder && item.brandOrder.length > 0 ? item.brandOrder : (item.brand ? [item.brand] : []);
            let effectiveNotes = item.notes || '';

            if (storeId && item.customizeByStore && item.storeCustomizations && item.storeCustomizations[storeId]) {
                const custom = item.storeCustomizations[storeId];
                if (custom.brandOrder && custom.brandOrder.length > 0 && custom.brandOrder[0]) {
                    effectiveBrandArr = custom.brandOrder;
                }
                if (custom.notes !== undefined && custom.notes !== '') {
                    effectiveNotes = custom.notes;
                }
            }

            bodyEl.innerHTML = `
                <div class="space-y-4 text-sm">
                    <div>
                        <span class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Item Name</span>
                        <p class="font-bold text-stone-900 text-base">${escapeHtml(item.name)}</p>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Category</span>
                            <p class="font-semibold text-stone-800">${escapeHtml(item.category || 'Uncategorized')}</p>
                        </div>
                        <div>
                            <span class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Unit</span>
                            <p class="font-semibold text-stone-800">${escapeHtml(item.unit || 'None')}</p>
                        </div>
                    </div>
                    <div>
                        <span class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-1.5">Brands (Preferred Order)</span>
                        ${effectiveBrandArr.length === 0 ? `<p class="text-xs text-stone-400 italic">No brands specified.</p>` : `
                            <ol class="list-decimal list-inside space-y-1 bg-stone-50 border-2 border-stone-200 rounded-2xl p-3">
                                ${effectiveBrandArr.map(b => `<li class="font-semibold text-stone-800 text-xs">${escapeHtml(b)}</li>`).join('')}
                            </ol>
                        `}
                    </div>
                    <div>
                        <span class="block text-[11px] font-bold uppercase tracking-wider text-stone-400 mb-0.5">Notes</span>
                        <p class="text-stone-700 bg-stone-50 border-2 border-stone-200 rounded-2xl p-3 text-xs leading-relaxed">${escapeHtml(effectiveNotes || 'No notes.')}</p>
                    </div>
                </div>`;

            footerEl.innerHTML = `
                <div></div>
                <button onclick="closeItemDetailModal()" class="bg-stone-900 hover:bg-black text-white font-semibold px-6 py-3 rounded-2xl text-xs transition shadow-md cursor-pointer">Close</button>
            `;
            modal.classList.remove('hidden');
        }

        // Item Details & Modal Handling
        let tempBrandOrder = [];
        let tempStoreCustomizations = {};
        let activeCustomStoreTab = null;

        function openItemDetailModal(itemId, defaultStoreId = null, initialName = '') {
            const modal = document.getElementById('itemDetailModal');
            const titleEl = document.getElementById('itemModalTitle');
            const bodyEl = document.getElementById('itemDetailBody');
            const footerEl = document.getElementById('itemModalFooter');

            const isNew = !itemId;
            titleEl.textContent = isNew ? 'Create New Item' : 'Item Details';

            let item = isNew ? {
                name: initialName || '', category: '', brand: '', unit: '', notes: '',
                stores: defaultStoreId ? [defaultStoreId] : (activeStoreId ? [activeStoreId] : []),
                brandOrder: [], customizeByStore: false, storeCustomizations: {}
            } : JSON.parse(JSON.stringify(db.items.find(i => i.id === itemId)));

            if (!item) return;
            tempBrandOrder = item.brandOrder ? [...item.brandOrder] : (item.brand ? [item.brand] : []);
            tempStoreCustomizations = item.storeCustomizations ? JSON.parse(JSON.stringify(item.storeCustomizations)) : {};
            
            const assignedStores = (db.stores || []).filter(s => item.stores && item.stores.includes(s.id));
            activeCustomStoreTab = assignedStores.length > 0 ? assignedStores[0].id : null;

            const sortedCategories = [...(db.categories || [])].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            const sortedUnits = [...(db.units || [])].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));

            bodyEl.innerHTML = `
                <div class="space-y-4">
                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Item Name *</label>
                        <input type="text" id="detailName" value="${escapeHtml(item.name)}" class="w-full bg-stone-50 border-2 border-stone-300 focus:border-stone-900 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none transition">
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Category</label>
                            <select id="detailCategory" size="11" class="w-full bg-stone-50 border-2 border-stone-300 focus:border-stone-900 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none transition">
                                <option value="" ${!item.category ? 'selected' : ''}>Select Category</option>
                                ${sortedCategories.map(cat => `<option value="${escapeHtml(cat)}" ${item.category === cat ? 'selected' : ''}>${escapeHtml(cat)}</option>`).join('')}
                            </select>
                        </div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Unit</label>
                            <select id="detailUnit" size="11" class="w-full bg-stone-50 border-2 border-stone-300 focus:border-stone-900 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none transition">
                                <option value="" ${!item.unit ? 'selected' : ''}>Select Unit</option>
                                ${sortedUnits.map(u => `<option value="${escapeHtml(u)}" ${item.unit === u ? 'selected' : ''}>${escapeHtml(u)}</option>`).join('')}
                            </select>
                        </div>
                    </div>

                    <div id="globalBrandNotesSection" class="space-y-4 bg-stone-50/80 border-2 border-stone-200 rounded-3xl p-4">
                        <div class="flex items-center justify-between mb-1">
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500">Global Brands (Preferred Order)</label>
                            <button type="button" onclick="addBrandField()" class="text-xs text-stone-800 hover:text-black font-semibold flex items-center gap-1.5 bg-white px-2.5 py-1 rounded-xl border border-stone-200 transition cursor-pointer"><i class="fa-solid fa-plus text-[10px]"></i> Add Brand</button>
                        </div>
                        <div id="brandListContainer" class="space-y-2.5"></div>
                        <div>
                            <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5 mt-3">Global Notes</label>
                            <textarea id="detailNotes" rows="2" class="w-full bg-white border-2 border-stone-300 focus:border-stone-900 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none transition">${escapeHtml(item.notes || '')}</textarea>
                        </div>
                    </div>

                    <div class="border-2 border-stone-300 rounded-3xl p-4 bg-white space-y-3">
                        <label class="flex items-center justify-between cursor-pointer">
                            <div>
                                <span class="text-xs font-bold text-stone-900 block">Customize Brand & Notes by Store</span>
                                <span class="text-[11px] text-stone-500 block leading-tight mt-0.5">Define unique brands or notes for specific stores</span>
                            </div>
                            <input type="checkbox" id="detailCustomizeToggle" ${item.customizeByStore ? 'checked' : ''} onchange="toggleCustomizeMode(this.checked)" class="w-5 h-5 rounded-lg border-stone-300 text-stone-900 focus:ring-0 cursor-pointer">
                        </label>
                        
                        <div id="storeCustomizeContainer" class="${item.customizeByStore ? '' : 'hidden'} pt-3 border-t border-stone-200 space-y-3">
                            <div class="flex flex-wrap gap-1.5" id="customStoreTabsHeader"></div>
                            <div id="customStoreEditorBody" class="bg-stone-50 border border-stone-200 rounded-2xl p-3.5 space-y-3"></div>
                        </div>
                    </div>

                    <div>
                        <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Available Stores</label>
                        <div class="grid grid-cols-2 gap-2 max-h-32 overflow-y-auto p-3 border-2 border-stone-300 rounded-2xl bg-stone-50">
                            ${(db.stores || []).map(store => `
                                <label class="flex items-center gap-2.5 text-xs font-semibold text-stone-700 cursor-pointer">
                                    <input type="checkbox" value="${store.id}" ${item.stores?.includes(store.id) ? 'checked' : ''} onchange="handleStoreCheckboxChange()" class="store-checkbox rounded border-stone-300 bg-white text-stone-900 focus:ring-0">
                                    <span class="truncate">${escapeHtml(store.name)}</span>
                                </label>`).join('')}
                        </div>
                    </div>
                </div>`;

            renderBrandInputs();
            renderCustomStoreTabs();
            renderCustomStoreEditor();

            footerEl.innerHTML = `
                <div></div>
                <div class="flex gap-2.5">
                    <button onclick="closeItemDetailModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold px-5 py-3 rounded-2xl text-xs transition cursor-pointer">Cancel</button>
                    <button onclick="stageSaveItem(${isNew ? 'null' : `'${item.id}'`})" class="bg-stone-900 hover:bg-black text-white font-semibold px-6 py-3 rounded-2xl text-xs transition shadow-md cursor-pointer">Save Changes</button>
                </div>`;
            modal.classList.remove('hidden');

            setTimeout(() => {
                const nameInput = document.getElementById('detailName');
                if (nameInput) {
                    nameInput.focus();
                    nameInput.setSelectionRange(nameInput.value.length, nameInput.value.length);
                }
            }, 50);
        }

        function toggleCustomizeMode(isCustomized) {
            const container = document.getElementById('storeCustomizeContainer');
            const globalSection = document.getElementById('globalBrandNotesSection');
            if (isCustomized) {
                container.classList.remove('hidden');
                globalSection.className = "space-y-4 bg-stone-100/70 border-2 border-stone-300 rounded-3xl p-4 opacity-60";
            } else {
                container.classList.add('hidden');
                globalSection.className = "space-y-4 bg-stone-50/80 border-2 border-stone-200 rounded-3xl p-4";
            }
        }

        function getCheckedStoreIds() {
            const ids = [];
            document.querySelectorAll('.store-checkbox:checked').forEach(cb => ids.push(cb.value));
            return ids;
        }

        function handleStoreCheckboxChange() {
            const checkedIds = getCheckedStoreIds();
            if (!checkedIds.includes(activeCustomStoreTab)) {
                activeCustomStoreTab = checkedIds.length > 0 ? checkedIds[0] : null;
            }
            renderCustomStoreTabs();
            renderCustomStoreEditor();
        }

        function renderCustomStoreTabs() {
            const headerEl = document.getElementById('customStoreTabsHeader');
            if (!headerEl) return;
            const checkedIds = getCheckedStoreIds();
            if (checkedIds.length === 0) {
                headerEl.innerHTML = `<p class="text-xs text-stone-400 italic">Select at least one available store above to customize.</p>`;
                return;
            }
            headerEl.innerHTML = checkedIds.map(sid => {
                const store = db.stores.find(s => s.id === sid);
                if (!store) return '';
                const isActive = activeCustomStoreTab === sid;
                return `
                    <button type="button" onclick="switchCustomStoreTab('${sid}')" class="px-3 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${isActive ? 'bg-stone-900 text-white shadow-sm' : 'bg-white border border-stone-300 text-stone-700 hover:bg-stone-100'}">
                        ${escapeHtml(store.name)}
                    </button>
                `;
            }).join('');
        }

        function switchCustomStoreTab(storeId) {
            activeCustomStoreTab = storeId;
            renderCustomStoreTabs();
            renderCustomStoreEditor();
        }

        function renderCustomStoreEditor() {
            const editorEl = document.getElementById('customStoreEditorBody');
            if (!editorEl) return;
            if (!activeCustomStoreTab) {
                editorEl.innerHTML = `<p class="text-xs text-stone-400 italic">No store selected.</p>`;
                return;
            }
            const store = db.stores.find(s => s.id === activeCustomStoreTab);
            if (!store) return;

            if (!tempStoreCustomizations[activeCustomStoreTab]) {
                tempStoreCustomizations[activeCustomStoreTab] = { brandOrder: [''], notes: '' };
            }
            const storeCustom = tempStoreCustomizations[activeCustomStoreTab];
            const storeBrands = storeCustom.brandOrder && storeCustom.brandOrder.length > 0 ? storeCustom.brandOrder : [''];

            editorEl.innerHTML = `
                <div class="flex items-center justify-between mb-1">
                    <span class="text-xs font-bold text-stone-800 uppercase tracking-wider">${escapeHtml(store.name)} Brands</span>
                    <button type="button" onclick="addStoreBrandField('${store.id}')" class="text-xs text-stone-800 font-semibold bg-white px-2.5 py-1 rounded-xl border border-stone-300 transition cursor-pointer"><i class="fa-solid fa-plus text-[10px]"></i> Add Brand</button>
                </div>
                <div class="space-y-2">
                    ${storeBrands.map((b, idx) => `
                        <div class="flex items-center gap-2">
                            <input type="text" value="${escapeHtml(b)}" onchange="updateStoreBrandVal('${store.id}',${idx}, this.value)" class="flex-1 bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none transition" placeholder="Brand name">
                            <button type="button" onclick="removeStoreBrandField('${store.id}',${idx})" class="w-7 h-7 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs transition cursor-pointer flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    `).join('')}
                </div>
                <div class="pt-2">
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1">${escapeHtml(store.name)} Notes</label>
                    <textarea rows="2" onchange="updateStoreNotesVal('${store.id}', this.value)" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-2 text-xs text-stone-800 focus:outline-none transition" placeholder="Store-specific notes...">${escapeHtml(storeCustom.notes || '')}</textarea>
                </div>
            `;
        }

        function addStoreBrandField(storeId) {
            if (!tempStoreCustomizations[storeId]) tempStoreCustomizations[storeId] = { brandOrder: [], notes: '' };
            tempStoreCustomizations[storeId].brandOrder.push('');
            renderCustomStoreEditor();
        }

        function updateStoreBrandVal(storeId, idx, val) {
            if (tempStoreCustomizations[storeId] && tempStoreCustomizations[storeId].brandOrder) {
                tempStoreCustomizations[storeId].brandOrder[idx] = val.trim();
            }
        }

        function removeStoreBrandField(storeId, idx) {
            if (tempStoreCustomizations[storeId] && tempStoreCustomizations[storeId].brandOrder) {
                tempStoreCustomizations[storeId].brandOrder.splice(idx, 1);
                renderCustomStoreEditor();
            }
        }

        function updateStoreNotesVal(storeId, val) {
            if (!tempStoreCustomizations[storeId]) tempStoreCustomizations[storeId] = { brandOrder: [], notes: '' };
            tempStoreCustomizations[storeId].notes = val.trim();
        }

        function renderBrandInputs() {
            const container = document.getElementById('brandListContainer');
            if (!container) return;
            if (tempBrandOrder.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-400 italic">No global brands specified.</p>`;
                return;
            }
            container.innerHTML = tempBrandOrder.map((brand, idx) => `
                <div class="flex items-center gap-2.5">
                    <input type="text" value="${escapeHtml(brand)}" onchange="tempBrandOrder[${idx}]=this.value.trim()" class="flex-1 bg-white border-2 border-stone-300 focus:border-stone-900 rounded-2xl px-4 py-2.5 text-sm text-stone-800 focus:outline-none transition" placeholder="Brand name">
                    <div class="flex items-center gap-1.5">
                        <button type="button" onclick="moveBrand(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-25 cursor-not-allowed"' : ''} class="w-8 h-8 bg-white hover:bg-stone-100 rounded-xl text-xs text-stone-700 transition cursor-pointer border border-stone-300"><i class="fa-solid fa-arrow-up"></i></button>
                        <button type="button" onclick="moveBrand(${idx}, 1)" ${idx === tempBrandOrder.length - 1 ? 'disabled class="opacity-25 cursor-not-allowed"' : ''} class="w-8 h-8 bg-white hover:bg-stone-100 rounded-xl text-xs text-stone-700 transition cursor-pointer border border-stone-300"><i class="fa-solid fa-arrow-down"></i></button>
                        <button type="button" onclick="tempBrandOrder.splice(${idx},1);renderBrandInputs();" class="w-8 h-8 bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 rounded-xl text-xs transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                </div>`).join('');
        }
        function addBrandField() { tempBrandOrder.push(''); renderBrandInputs(); }
        function moveBrand(idx, dir) {
            const target = idx + dir;
            if (target < 0 || target >= tempBrandOrder.length) return;
            const tmp = tempBrandOrder[idx]; tempBrandOrder[idx] = tempBrandOrder[target]; tempBrandOrder[target] = tmp;
            renderBrandInputs();
        }

        function closeItemDetailModal() { document.getElementById('itemDetailModal').classList.add('hidden'); }

        function stageSaveItem(itemId) {
            const name = document.getElementById('detailName').value.trim();
            if (!name) { alert('Item name is required.'); return; }
            const category = document.getElementById('detailCategory').value;
            const unit = document.getElementById('detailUnit').value;
            const notes = document.getElementById('detailNotes').value.trim();
            const stores = [];
            document.querySelectorAll('.store-checkbox:checked').forEach(cb => stores.push(cb.value));
            const cleanBrands = tempBrandOrder.filter(b => b.length > 0);
            const customizeByStore = document.getElementById('detailCustomizeToggle').checked;

            const cleanedCustomizations = {};
            if (customizeByStore) {
                Object.keys(tempStoreCustomizations).forEach(sid => {
                    if (stores.includes(sid)) {
                        const cust = tempStoreCustomizations[sid];
                        cleanedCustomizations[sid] = {
                            brandOrder: cust.brandOrder ? cust.brandOrder.filter(b => b.length > 0) : [],
                            notes: cust.notes || ''
                        };
                    }
                });
            }

            masterSearchQuery = '';
            storeSearchQuery = '';

            // Close the item details modal immediately so it doesn't block the confirmation prompt
            closeItemDetailModal();

            openConfirmModal("Save Changes", "Are you sure you want to save these changes?", () => {
                if (itemId !== null) {
                    const item = db.items.find(i => i.id === itemId);
                    if (item) {
                        item.name = name; 
                        item.category = category; 
                        item.brand = cleanBrands[0] || '';
                        item.unit = unit; 
                        item.notes = notes; 
                        item.stores = stores; 
                        item.brandOrder = cleanBrands;
                        item.customizeByStore = customizeByStore;
                        item.storeCustomizations = cleanedCustomizations;
                    }
                } else {
                    db.items.push({
                        id: 'item_' + Date.now(), 
                        name, 
                        category, 
                        brand: cleanBrands[0] || '',
                        unit, 
                        notes, 
                        stores, 
                        brandOrder: cleanBrands,
                        customizeByStore,
                        storeCustomizations: cleanedCustomizations
                    });
                }
                saveLocalData();
                renderAll();
            });
        }

        let confirmCallback = null;
        function openConfirmModal(title, message, onConfirm) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = onConfirm;
            document.getElementById('confirmModal').classList.remove('hidden');
        }
        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.add('hidden');
            confirmCallback = null;
        }
        document.getElementById('confirmBtnYes').onclick = () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        };

        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }
    </script>
</body>
</html>
