<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Grocery Shopping</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body id="appBody" class="bg-stone-100 text-stone-800 font-sans antialiased min-h-screen flex flex-col transition-colors duration-500">

    <!-- CONFIGURATION MODAL -->
    <div id="configModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-stone-200 rounded-3xl w-full max-w-md p-6 shadow-2xl">
            <h3 class="text-xl font-bold tracking-tight mb-2 text-stone-900 flex items-center gap-2.5">
                <i class="fa-solid fa-cloud-arrow-up text-stone-800"></i> Cloud Storage Sync
            </h3>
            <p class="text-xs text-stone-500 mb-5 leading-relaxed">Configure your JSONBin credentials for seamless multi-device persistence.</p>
            <div class="space-y-4">
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Master Key</label>
                    <input type="password" id="inputMasterKey" class="w-full bg-stone-50 border-2 border-stone-300 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none focus:border-stone-900 transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Bin ID</label>
                    <input type="text" id="inputBinId" class="w-full bg-stone-50 border-2 border-stone-300 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none focus:border-stone-900 transition">
                </div>
                <div class="flex gap-2.5 pt-3">
                    <button onclick="saveConfig()" class="flex-1 bg-stone-900 hover:bg-black text-white font-semibold py-3 rounded-2xl transition shadow-md cursor-pointer">Connect</button>
                    <button onclick="toggleConfigModal(false)" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold px-5 py-3 rounded-2xl transition cursor-pointer">Cancel</button>
                </div>
            </div>
        </div>
    </div>

    <!-- CONFIRMATION MODAL -->
    <div id="confirmModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs z-[60] flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-stone-200 rounded-3xl w-full max-w-sm p-6 shadow-2xl text-center">
            <div class="w-14 h-14 bg-rose-50 text-rose-600 border border-rose-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-xl">
                <i class="fa-solid fa-triangle-exclamation"></i>
            </div>
            <h3 id="confirmTitle" class="text-lg font-bold text-stone-900 mb-1">Confirm Action</h3>
            <p id="confirmMessage" class="text-xs text-stone-500 mb-6 leading-relaxed">Are you sure you want to proceed?</p>
            <div class="flex gap-3">
                <button id="confirmBtnYes" class="flex-1 bg-rose-600 hover:bg-rose-700 text-white font-semibold py-3 rounded-2xl transition shadow-md shadow-rose-600/20 cursor-pointer">Confirm</button>
                <button onclick="closeConfirmModal()" class="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold py-3 rounded-2xl transition cursor-pointer">Cancel</button>
            </div>
        </div>
    </div>

    <!-- ITEM DETAILS CARD / MODAL -->
    <div id="itemDetailModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-end sm:items-center justify-center sm:p-4 hidden">
        <div class="bg-white border border-stone-200 rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-5 border-b border-stone-100 flex items-center justify-between bg-stone-50">
                <h3 id="itemModalTitle" class="font-bold text-stone-900 text-base">Item Details</h3>
                <button onclick="closeItemDetailModal()" class="w-9 h-9 rounded-2xl bg-stone-200/60 border border-stone-300 flex items-center justify-center text-stone-600 hover:bg-stone-200 transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="p-6 overflow-y-auto space-y-5 flex-1" id="itemDetailBody"></div>
            <div class="p-4 border-t border-stone-100 bg-stone-50 flex gap-3 justify-between" id="itemModalFooter"></div>
        </div>
    </div>

    <!-- STORE SETTINGS CARD / MODAL -->
    <div id="storeCardModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-stone-200 rounded-3xl w-full max-w-md p-6 shadow-2xl overflow-hidden">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-100">
                <h3 id="storeCardModalTitle" class="font-bold text-stone-900 text-base">Store Settings</h3>
                <button onclick="closeStoreCardModal()" class="w-8 h-8 rounded-xl bg-stone-100 border border-stone-300 flex items-center justify-center text-stone-600 hover:bg-stone-200 transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-4" id="storeCardModalBody"></div>
            <div class="flex gap-3 pt-5 mt-4 border-t border-stone-100">
                <button id="storeCardSaveBtn" class="flex-1 font-semibold py-3 rounded-2xl transition shadow-md cursor-pointer text-white">Save Store</button>
                <button onclick="closeStoreCardModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 font-semibold px-5 py-3 rounded-2xl transition cursor-pointer">Cancel</button>
            </div>
        </div>
    </div>

    <!-- MANAGE STORES MODAL -->
    <div id="manageStoresModal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white border border-stone-200 rounded-3xl w-full max-w-md p-6 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-100">
                <h3 class="font-bold text-stone-900 text-base">Manage Stores</h3>
                <button onclick="closeManageStoresModal()" class="w-8 h-8 rounded-xl bg-stone-100 border border-stone-300 flex items-center justify-center text-stone-600 hover:bg-stone-200 transition cursor-pointer"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-3 overflow-y-auto flex-1 pr-1" id="manageStoresBody"></div>
            <div class="pt-4 mt-4 border-t border-stone-100">
                <button onclick="closeManageStoresModal()" class="w-full bg-stone-900 hover:bg-black text-white font-semibold py-3 rounded-2xl transition shadow-md cursor-pointer">Done</button>
            </div>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="flex flex-1 relative overflow-hidden">

        <!-- SIDEBAR DRAWER -->
        <div id="sidebarOverlay" class="fixed inset-0 bg-black/30 backdrop-blur-xs z-30 md:hidden hidden" onclick="toggleSidebar()"></div>
        <aside id="sidebar" class="fixed md:static inset-y-0 left-0 w-72 bg-stone-900 border-r border-stone-800 text-stone-300 z-40 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col shadow-2xl">
            <div class="p-5 border-b border-stone-800 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-2xl bg-stone-800 border border-stone-700 flex items-center justify-center text-stone-200 font-bold shadow-xs"><i class="fa-solid fa-basket-shopping text-sm"></i></div>
                    <h1 class="font-bold tracking-tight text-base text-white">Grocery Shopping</h1>
                </div>
                <button onclick="toggleSidebar()" class="md:hidden text-stone-400 hover:text-white p-1 border border-stone-700 rounded-xl cursor-pointer"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>

            <!-- Sidebar Content -->
            <div class="flex-1 overflow-y-auto p-5 space-y-6">
                <!-- Stores Section -->
                <div>
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <span class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Stores</span>
                            <button onclick="openManageStoresModal()" class="text-stone-400 hover:text-white text-xs p-1 bg-stone-800/80 hover:bg-stone-800 rounded-lg border border-stone-700 transition cursor-pointer" title="Manage & Reorder Stores"><i class="fa-solid fa-pen text-[10px]"></i></button>
                        </div>
                        <button onclick="openStoreCardModal(null)" class="text-stone-300 hover:text-white text-xs font-semibold flex items-center gap-1.5 bg-stone-800 px-2.5 py-1 rounded-xl border border-stone-700 transition cursor-pointer"><i class="fa-solid fa-plus text-[10px]"></i> Add Store</button>
                    </div>
                    <div id="storeListContainer" class="space-y-1.5"></div>
                </div>

                <!-- Global Management Buttons -->
                <div>
                    <span class="text-[11px] font-bold uppercase tracking-wider text-stone-400 block mb-3">Global Management</span>
                    <div class="space-y-1.5">
                        <button onclick="switchView('master')" id="navMasterBtn" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer">
                            <i class="fa-solid fa-boxes-stacked w-5 text-center text-stone-400"></i> Full Item List
                        </button>
                        <button onclick="switchView('categories')" id="navCategoriesBtn" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer">
                            <i class="fa-solid fa-tags w-5 text-center text-stone-400"></i> Categories
                        </button>
                        <button onclick="switchView('units')" id="navUnitsBtn" class="w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer">
                            <i class="fa-solid fa-scale-balanced w-5 text-center text-stone-400"></i> Units
                        </button>
                    </div>
                </div>
            </div>

            <!-- Footer / Sync status -->
            <div class="p-4 border-t border-stone-800 bg-stone-950/50 flex items-center justify-between text-xs text-stone-400">
                <button onclick="triggerSyncToCloudManual()" class="hover:text-white inline-flex items-center gap-2 bg-stone-800 hover:bg-stone-700 px-3 py-2.5 rounded-xl border border-stone-700 transition cursor-pointer">
                    <span class="font-medium text-stone-300">Sync to Cloud</span>
                    <span id="syncIndicator" class="w-2.5 h-2.5 rounded-full bg-stone-400 shadow-sm shrink-0"></span>
                </button>
                <button onclick="toggleConfigModal(true)" class="hover:text-white bg-stone-800 hover:bg-stone-700 px-3 py-2.5 rounded-xl border border-stone-700 transition cursor-pointer" title="Setup Credentials"><i class="fa-solid fa-gear text-xs"></i></button>
            </div>
        </aside>

        <!-- CONTENT AREA -->
        <main class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">
            <header id="mainHeader" class="bg-stone-200/90 backdrop-blur-md border-b border-stone-300 px-5 py-4 flex items-center justify-between shrink-0 transition-colors duration-500 shadow-xs">
                <div class="flex items-center gap-3.5">
                    <button onclick="toggleSidebar()" class="md:hidden text-stone-700 hover:text-stone-900 p-2 rounded-2xl border border-stone-300 bg-stone-100 cursor-pointer"><i class="fa-solid fa-bars text-base"></i></button>
                    <div>
                        <h2 id="currentStoreTitle" class="font-extrabold text-stone-900 text-lg tracking-tight leading-tight truncate">Full Item List</h2>
                        <p id="currentStoreSubtitle" class="text-xs text-stone-600 mt-0.5">Manage complete system database</p>
                    </div>
                </div>
                <div id="headerActions" class="flex items-center gap-2"></div>
            </header>

            <div id="stickyStoreHeaderControls"></div>
            <div id="mainContentArea" class="flex-1 overflow-y-auto p-3 sm:p-5 max-w-4xl w-full mx-auto"></div>
        </main>
    </div>

    <!-- SCRIPTS -->
    <script>
        let db = {
            stores: [], 
            categories: [], 
            units: [],
            items: [],  
            carts: {}   
        };

        let activeStoreId = null;
        let activeView = 'master'; // 'master', 'categories', 'units', 'store'
        let storeSubTab = 'items'; // 'items' or 'shopping-list' inside a store view
        let storeItemQuantities = {}; 
        let masterSearchQuery = '';
        let storeSearchQuery = '';
        let masterAlphaFilter = null;
        let storeAlphaFilter = null;
        let showMasterAlphaDrawer = false;
        let showStoreAlphaDrawer = false;

        const sophisticatedColors = [
            { name: 'Crimson Red', value: 'red', bgTint: 'bg-[rgb(212,204,206)]', headerBg: 'bg-[#700c22] text-white border-[#4c0519]', hex: '#700c22' },
            { name: 'Rust Orange', value: 'orange', bgTint: 'bg-[rgb(214,208,205)]', headerBg: 'bg-[#7c2d12] text-white border-[#431407]', hex: '#7c2d12' },
            { name: 'Deep Yellow', value: 'yellow', bgTint: 'bg-[rgb(218,214,201)]', headerBg: 'bg-[#ca8a04] text-white border-[#854d0e]', hex: '#ca8a04' },
            { name: 'Forest Green', value: 'green', bgTint: 'bg-[rgb(202,208,206)]', headerBg: 'bg-[#023c2e] text-white border-[#022c22]', hex: '#023c2e' },
            { name: 'Navy Blue', value: 'blue', bgTint: 'bg-[rgb(205,210,217)]', headerBg: 'bg-[#12285e] text-white border-[#0f1b3b]', hex: '#12285e' },
            { name: 'Deep Purple', value: 'purple', bgTint: 'bg-[rgb(213,207,218)]', headerBg: 'bg-[#43146e] text-white border-[#2b0c47]', hex: '#43146e' },
            { name: 'Chocolate Brown', value: 'brown', bgTint: 'bg-[rgb(215,210,208)]', headerBg: 'bg-[#533b2e] text-white border-[#33231c]', hex: '#533b2e' },
            { name: 'Slate Charcoal', value: 'charcoal', bgTint: 'bg-[rgb(208,212,216)]', headerBg: 'bg-[#1e293b] text-white border-[#0f172a]', hex: '#1e293b' }
        ];

        function getStoreTheme(storeId) {
            const store = db.stores.find(s => s.id === storeId);
            const colorVal = store && store.themeColor ? store.themeColor : 'red';
            const found = sophisticatedColors.find(c => c.value === colorVal);
            return found || sophisticatedColors[0];
        }

        let config = {
            masterKey: localStorage.getItem('grocery_masterKey') || '',
            binId: localStorage.getItem('grocery_binId') || ''
        };

        let syncTimer = null;
        let pollInterval = null;

        loadLocalData();
        renderAll();

        window.addEventListener('DOMContentLoaded', () => {
            if (config.masterKey && config.binId) {
                fetchFromJSONBin(true);
                startCloudPolling();
            } else {
                updateSyncStatus('local');
            }
        });

        function loadLocalData() {
            const saved = localStorage.getItem('grocery_db');
            if (saved) {
                try {
                    db = JSON.parse(saved);
                    if (!db.categories) db.categories = ['Produce', 'Dairy', 'Bakery', 'Pantry'];
                    if (!db.units) db.units = ['Gallon', 'Bunch', 'Pack', 'Lbs', 'Ounce', 'Count'];
                    db.stores.forEach((s, idx) => {
                        if (!s.themeColor) s.themeColor = idx === 0 ? 'red' : 'blue';
                    });
                } catch (e) {
                    console.error("Error loading local DB", e);
                    initDefaultData();
                }
            } else {
                initDefaultData();
            }
        }

        function initDefaultData() {
            db = {
                stores: [
                    { id: 's1', name: 'Supermarket', themeColor: 'red' },
                    { id: 's2', name: 'Costco', themeColor: 'blue' }
                ],
                categories: ['Produce', 'Dairy', 'Bakery', 'Pantry'],
                units: ['Gallon', 'Bunch', 'Pack', 'Lbs', 'Ounce', 'Count'],
                items: [
                    { id: 'i1', name: 'Whole Milk', category: 'Dairy', brand: 'Organic Valley', unit: 'Gallon', notes: 'Get grass-fed if available', stores: ['s1', 's2'], brandOrder: ['Organic Valley', 'Horizon'], customizeByStore: false, storeCustomizations: {} },
                    { id: 'i2', name: 'Bananas', category: 'Produce', brand: 'Dole', unit: 'Bunch', notes: 'Look for slightly green ones', stores: ['s1'], brandOrder: ['Dole', 'Chiquita'], customizeByStore: false, storeCustomizations: {} }
                ],
                carts: { 's1': { 'i1': { quantity: 1, checked: false } } }
            };
            saveLocalData();
        }

        function saveLocalData() {
            localStorage.setItem('grocery_db', JSON.stringify(db));
            triggerSyncToCloud();
        }

        function updateSyncStatus(status) {
            const indicator = document.getElementById('syncIndicator');
            if (!indicator) return;
            indicator.className = "w-2.5 h-2.5 rounded-full " + (
                status === 'synced' ? 'bg-emerald-500 shadow-sm' :
                status === 'syncing' ? 'bg-amber-500 animate-pulse shadow-sm' : 
                status === 'local' ? 'bg-stone-400 shadow-sm' : 'bg-rose-500 shadow-sm'
            );
        }

        function triggerSyncToCloud() {
            if (!config.masterKey || !config.binId) {
                updateSyncStatus('local');
                return;
            }
            updateSyncStatus('syncing');
            clearTimeout(syncTimer);
            syncTimer = setTimeout(() => {
                fetch(`https://api.jsonbin.io/v3/b/${config.binId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': config.masterKey
                    },
                    body: JSON.stringify(db)
                })
                .then(res => {
                    if (!res.ok) throw new Error('Sync failed');
                    updateSyncStatus('synced');
                })
                .catch(err => {
                    console.error(err);
                    updateSyncStatus('error');
                });
            }, 300);
        }

        function triggerSyncToCloudManual() {
            if (!config.masterKey || !config.binId) {
                toggleConfigModal(true);
                return;
            }
            triggerSyncToCloud();
        }

        function fetchFromJSONBin(isInitial = false) {
            if (!config.masterKey || !config.binId) return;
            fetch(`https://api.jsonbin.io/v3/b/${config.binId}/latest`, {
                headers: { 'X-Master-Key': config.masterKey }
            })
            .then(res => res.json())
            .then(data => {
                let remoteRecord = data && data.record ? data.record : data;
                if (remoteRecord && remoteRecord.items && Array.isArray(remoteRecord.items)) {
                    const remoteStr = JSON.stringify(remoteRecord);
                    const localStr = JSON.stringify(db);
                    if (remoteStr !== localStr) {
                        db = remoteRecord;
                        if (!db.categories) db.categories = ['Produce', 'Dairy'];
                        if (!db.units) db.units = ['Gallon', 'Bunch', 'Pack', 'Lbs'];
                        db.stores.forEach((s) => { if (!s.themeColor) s.themeColor = 'red'; });
                        localStorage.setItem('grocery_db', JSON.stringify(db));
                        renderAll();
                    }
                    updateSyncStatus('synced');
                } else if (isInitial) {
                    triggerSyncToCloud();
                    renderAll();
                }
            })
            .catch(err => {
                console.error(err);
                if (isInitial) {
                    updateSyncStatus('error');
                    renderAll();
                }
            });
        }

        function startCloudPolling() {
            if (pollInterval) clearInterval(pollInterval);
            pollInterval = setInterval(() => {
                if (config.masterKey && config.binId) {
                    fetchFromJSONBin(false);
                }
            }, 3000);
        }

        function saveConfig() {
            const mk = document.getElementById('inputMasterKey').value.trim();
            const bid = document.getElementById('inputBinId').value.trim();
            if (!mk || !bid) {
                alert('Please fill out both Master Key and Bin ID.');
                return;
            }
            config.masterKey = mk;
            config.binId = bid;
            localStorage.setItem('grocery_masterKey', mk);
            localStorage.setItem('grocery_binId', bid);
            toggleConfigModal(false);
            fetchFromJSONBin(true);
            startCloudPolling();
        }

        function toggleConfigModal(show) {
            const modal = document.getElementById('configModal');
            if (show) {
                document.getElementById('inputMasterKey').value = config.masterKey;
                document.getElementById('inputBinId').value = config.binId;
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebarOverlay');
            sidebar.classList.toggle('-translate-x-full');
            overlay.classList.toggle('hidden');
        }

        function switchView(viewType, storeId = null) {
            activeView = viewType;
            activeStoreId = storeId;
            masterSearchQuery = '';
            storeSearchQuery = '';
            masterAlphaFilter = null;
            storeAlphaFilter = null;
            showMasterAlphaDrawer = false;
            showStoreAlphaDrawer = false;
            if (window.innerWidth < 768) {
                document.getElementById('sidebar').classList.add('-translate-x-full');
                document.getElementById('sidebarOverlay').classList.add('hidden');
            }
            renderAll();
        }

        function switchStoreTab(tab) {
            storeSubTab = tab;
            storeSearchQuery = '';
            storeAlphaFilter = null;
            showStoreAlphaDrawer = false;
            renderAll();
        }

        function renderAll() {
            renderStoresList();
            renderHeaderTitles();
            renderMainContent();
        }

        function renderHeaderTitles() {
            const titleEl = document.getElementById('currentStoreTitle');
            const subEl = document.getElementById('currentStoreSubtitle');
            const masterBtn = document.getElementById('navMasterBtn');
            const catBtn = document.getElementById('navCategoriesBtn');
            const unitsBtn = document.getElementById('navUnitsBtn');
            const appBody = document.getElementById('appBody');
            const mainHeader = document.getElementById('mainHeader');
            const headerActions = document.getElementById('headerActions');

            if (!titleEl) return;

            masterBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer";
            catBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer";
            unitsBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition text-stone-300 hover:bg-stone-800 hover:text-white cursor-pointer";
            headerActions.innerHTML = '';

            if (activeView === 'master') {
                titleEl.textContent = 'Full Item List';
                titleEl.className = "font-extrabold text-stone-900 text-lg tracking-tight leading-tight truncate";
                subEl.textContent = 'Manage complete system database';
                subEl.className = "text-xs text-stone-600 mt-0.5";
                masterBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition bg-stone-800 text-white shadow-sm border border-stone-700 cursor-pointer";
                appBody.className = "bg-stone-100 text-stone-800 font-sans antialiased min-h-screen flex flex-col transition-colors duration-500";
                mainHeader.className = "bg-stone-200/90 backdrop-blur-md border-b border-stone-300 px-5 py-4 flex items-center justify-between shrink-0 transition-colors duration-500 shadow-xs";
            } else if (activeView === 'categories') {
                titleEl.textContent = 'Categories';
                titleEl.className = "font-extrabold text-stone-900 text-lg tracking-tight leading-tight truncate";
                subEl.textContent = 'Manage product categories';
                subEl.className = "text-xs text-stone-600 mt-0.5";
                catBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition bg-stone-800 text-white shadow-sm border border-stone-700 cursor-pointer";
                appBody.className = "bg-stone-100 text-stone-800 font-sans antialiased min-h-screen flex flex-col transition-colors duration-500";
                mainHeader.className = "bg-stone-200/90 backdrop-blur-md border-b border-stone-300 px-5 py-4 flex items-center justify-between shrink-0 transition-colors duration-500 shadow-xs";
            } else if (activeView === 'units') {
                titleEl.textContent = 'Units';
                titleEl.className = "font-extrabold text-stone-900 text-lg tracking-tight leading-tight truncate";
                subEl.textContent = 'Manage measurement units';
                subEl.className = "text-xs text-stone-600 mt-0.5";
                unitsBtn.className = "w-full flex items-center gap-3 px-3.5 py-3 rounded-2xl text-sm font-medium transition bg-stone-800 text-white shadow-sm border border-stone-700 cursor-pointer";
                appBody.className = "bg-stone-100 text-stone-800 font-sans antialiased min-h-screen flex flex-col transition-colors duration-500";
                mainHeader.className = "bg-stone-200/90 backdrop-blur-md border-b border-stone-300 px-5 py-4 flex items-center justify-between shrink-0 transition-colors duration-500 shadow-xs";
            } else if (activeView === 'store') {
                const store = db.stores.find(s => s.id === activeStoreId);
                const theme = getStoreTheme(activeStoreId);
                titleEl.textContent = store ? store.name : 'Store';
                subEl.textContent = 'Store inventory & shopping list';

                appBody.className = `${theme.bgTint} text-stone-800 font-sans antialiased min-h-screen flex flex-col transition-colors duration-500`;
                mainHeader.className = `backdrop-blur-md border-b px-5 py-4 flex items-center justify-between shrink-0 transition-colors duration-500 shadow-md ${theme.headerBg}`;
                
                titleEl.className = "font-extrabold text-white text-lg tracking-tight leading-tight truncate";
                subEl.className = "text-xs opacity-90 mt-0.5 text-stone-100";

                headerActions.innerHTML = `
                    <button onclick="openStoreCardModal('${activeStoreId}')" class="bg-white/15 hover:bg-white/25 border border-white/30 text-white text-xs font-semibold px-3.5 py-2 rounded-xl transition shadow-xs cursor-pointer flex items-center gap-1.5">
                        <i class="fa-solid fa-pen text-[10px]"></i> Edit Store
                    </button>`;
            }
        }

        function sortItemsAlphabetically(itemsArray) {
            return [...itemsArray].sort((a, b) => {
                const catA = (a.category && a.category !== '' ? a.category : 'Uncategorized').toLowerCase();
                const catB = (b.category && b.category !== '' ? b.category : 'Uncategorized').toLowerCase();
                if (catA < catB) return -1;
                if (catA > catB) return 1;

                const nameA = (a.name || '').toLowerCase();
                const nameB = (b.name || '').toLowerCase();
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });
        }

        function sortCartItemsAlphabetically(itemsArray, cartData) {
            return [...itemsArray].sort((a, b) => {
                const checkedA = cartData[a.id]?.checked ? 1 : 0;
                const checkedB = cartData[b.id]?.checked ? 1 : 0;
                if (checkedA !== checkedB) return checkedA - checkedB;

                const catA = (a.category && a.category !== '' ? a.category : 'Uncategorized').toLowerCase();
                const catB = (b.category && b.category !== '' ? b.category : 'Uncategorized').toLowerCase();
                if (catA < catB) return -1;
                if (catA > catB) return 1;

                const nameA = (a.name || '').toLowerCase();
                const nameB = (b.name || '').toLowerCase();
                if (nameA < nameB) return -1;
                if (nameA > nameB) return 1;
                return 0;
            });
        }

        function renderStoresList() {
            const container = document.getElementById('storeListContainer');
            if (!container) return;
            if (db.stores.length === 0) {
                container.innerHTML = `<p class="text-xs text-stone-500 italic py-1">No stores added yet.</p>`;
                return;
            }
            container.innerHTML = db.stores.map(store => {
                const isActive = (activeView === 'store' && activeStoreId === store.id);
                const theme = getStoreTheme(store.id);
                return `
                    <div class="group flex items-center justify-between rounded-2xl px-3.5 py-2.5 transition ${isActive ? 'bg-stone-800 text-white font-semibold shadow-sm border border-stone-700' : 'text-stone-300 hover:bg-stone-800/60 hover:text-white'}">
                        <button onclick="switchView('store', '${store.id}'); switchStoreTab('items');" class="flex-1 text-left text-sm truncate flex items-center gap-2.5 cursor-pointer">
                            <span class="w-3 h-3 rounded-full shrink-0 shadow-xs border border-white/20" style="background-color: ${theme.hex};"></span> 
                            <span class="truncate">${escapeHtml(store.name)}</span>
                        </button>
                        <div class="flex items-center gap-1 opacity-70 group-hover:opacity-100">
                            <button onclick="event.stopPropagation(); openStoreCardModal('${store.id}')" class="p-1.5 hover:text-amber-400 text-xs transition cursor-pointer" title="Edit Store"><i class="fa-solid fa-pen"></i></button>
                            <button onclick="event.stopPropagation(); confirmDeleteStore('${store.id}')" class="p-1.5 hover:text-rose-400 text-xs transition border border-stone-700 rounded-lg cursor-pointer" title="Delete Store"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderMainContent() {
            const container = document.getElementById('mainContentArea');
            const stickyHeaderContainer = document.getElementById('stickyStoreHeaderControls');
            if (!container || !stickyHeaderContainer) return;

            stickyHeaderContainer.innerHTML = '';

            if (activeView === 'store') {
                const storeId = activeStoreId;
                const theme = getStoreTheme(storeId);
                const storeItems = (db.items || []).filter(item => item.stores && item.stores.includes(storeId));
                const cartData = (db.carts || {})[storeId] || {};
                const cartItems = (db.items || []).filter(item => cartData[item.id] !== undefined);

                stickyHeaderContainer.innerHTML = `
                    <div class="sticky top-0 ${theme.bgTint} pt-3 px-3 sm:px-5 pb-3 z-20 space-y-3 border-b border-stone-300 shadow-xs">
                        <div class="max-w-4xl w-full mx-auto space-y-3">
                            <div class="flex gap-3">
                                <button onclick="switchStoreTab('items')" class="flex-1 py-2.5 px-4 rounded-2xl transition flex items-center justify-center gap-2.5 cursor-pointer ${storeSubTab === 'items' ? `${theme.headerBg} text-base scale-[1.02] shadow-xl font-extrabold ring-2 ring-black/20` : 'bg-white border border-stone-200 text-stone-600 text-sm font-medium hover:bg-stone-100'}">
                                    <i class="fa-solid fa-boxes-stacked"></i> Store Items (${storeItems.length})
                                </button>
                                <button onclick="switchStoreTab('shopping-list')" class="flex-1 py-2.5 px-4 rounded-2xl transition flex items-center justify-center gap-2.5 cursor-pointer ${storeSubTab === 'shopping-list' ? `${theme.headerBg} text-base scale-[1.02] shadow-xl font-extrabold ring-2 ring-black/20` : 'bg-white border border-stone-200 text-stone-600 text-sm font-medium hover:bg-stone-100'}">
                                    <i class="fa-solid fa-cart-shopping"></i> Shopping List (${cartItems.length})
                                </button>
                            </div>

                            ${storeSubTab === 'items' ? `
                                <div class="space-y-2">
                                    <div class="flex gap-2">
                                        <button onclick="clearAlphaFilter('store')" class="bg-white hover:bg-stone-50 border-2 border-stone-300 text-stone-700 text-xs font-bold px-3 py-3 rounded-2xl transition shadow-xs cursor-pointer shrink-0">ALL</button>
                                        <button onclick="toggleAlphaDrawer('store')" class="bg-white hover:bg-stone-50 border-2 border-stone-300 text-stone-700 text-xs font-bold px-3.5 py-3 rounded-2xl transition shadow-xs cursor-pointer shrink-0 flex items-center gap-1.5">
                                            <i class="fa-solid fa-arrow-down-a-z text-xs"></i> A-Z ${storeAlphaFilter ? `(${storeAlphaFilter})` : ''}
                                        </button>
                                        <div class="relative flex-1">
                                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-stone-400 text-xs"></i>
                                            <input type="text" id="storeSearchInput" value="${escapeHtml(storeSearchQuery)}" oninput="storeSearchQuery=this.value; renderStoreContainerView(document.getElementById('mainContentArea'), '${storeId}'); document.getElementById('storeSearchInput').focus();" placeholder="Search store items..." class="w-full bg-white border-2 border-stone-300 focus:border-stone-900 rounded-2xl pl-10 pr-4 py-3 text-sm text-stone-800 focus:outline-none transition shadow-none">
                                            ${storeSearchQuery ? `<button onclick="storeSearchQuery=''; renderStoreContainerView(document.getElementById('mainContentArea'), '${storeId}');" class="absolute right-3.5 top-3 text-stone-400 hover:text-stone-700 text-xs border border-stone-300 rounded px-1"><i class="fa-solid fa-xmark"></i></button>` : ''}
                                        </div>
                                        <button onclick="openItemDetailModal(null, '${storeId}', storeSearchQuery)" class="text-xs font-bold px-3.5 py-2.5 rounded-2xl transition flex items-center gap-1.5 shrink-0 cursor-pointer text-white shadow-md" style="background-color: ${theme.hex};">
                                            <i class="fa-solid fa-plus text-[10px]"></i> Add Item
                                        </button>
                                    </div>
                                    ${showStoreAlphaDrawer ? renderAlphaDrawer('store') : ''}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            if (activeView === 'master') {
                renderMasterListView(container);
            } else if (activeView === 'categories') {
                renderCategoriesManagementView(container);
            } else if (activeView === 'units') {
                renderUnitsManagementView(container);
            } else if (activeView === 'store') {
                renderStoreContainerView(container, activeStoreId);
            }
        }

        function renderAlphaDrawer(type) {
            const isMaster = type === 'master';
            const activeFilter = isMaster ? masterAlphaFilter : storeAlphaFilter;
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");

            return `
                <div class="bg-white border-2 border-stone-300 rounded-2xl p-3 shadow-md mb-3 space-y-2">
                    <div class="flex items-center justify-between">
                        <span class="text-xs font-bold uppercase tracking-wider text-stone-500">Filter by Letter ${activeFilter ? `(Active: ${activeFilter})` : ''}</span>
                        <button onclick="toggleAlphaDrawer('${type}')" class="text-xs text-stone-500 hover:text-stone-800 font-semibold cursor-pointer"><i class="fa-solid fa-xmark border border-stone-300 rounded px-1"></i> Close</button>
                    </div>
                    <div class="flex flex-wrap gap-1.5">
                        ${alphabet.map(letter => `
                            <button onclick="selectAlphaFilter('${type}', '${letter}')" class="w-8 h-8 rounded-xl text-xs font-bold transition cursor-pointer ${activeFilter === letter ? 'bg-stone-900 text-white shadow-sm' : 'bg-stone-100 hover:bg-stone-200 text-stone-700'}">${letter}</button>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function toggleAlphaDrawer(type) {
            if (type === 'master') {
                showMasterAlphaDrawer = !showMasterAlphaDrawer;
                renderMasterListView(document.getElementById('mainContentArea'));
            } else {
                showStoreAlphaDrawer = !showStoreAlphaDrawer;
                renderStoreContainerView(document.getElementById('mainContentArea'), activeStoreId);
            }
        }

        function selectAlphaFilter(type, letter) {
            if (type === 'master') {
                masterAlphaFilter = letter;
                showMasterAlphaDrawer = false;
                renderMasterListView(document.getElementById('mainContentArea'));
            } else {
                storeAlphaFilter = letter;
                showStoreAlphaDrawer = false;
                renderStoreContainerView(document.getElementById('mainContentArea'), activeStoreId);
            }
        }

        function clearAlphaFilter(type) {
            if (type === 'master') {
                masterAlphaFilter = null;
                showMasterAlphaDrawer = false;
                renderMasterListView(document.getElementById('mainContentArea'));
            } else {
                storeAlphaFilter = null;
                showStoreAlphaDrawer = false;
                renderStoreContainerView(document.getElementById('mainContentArea'), activeStoreId);
            }
        }

        function renderMasterListView(container) {
            const query = masterSearchQuery.toLowerCase().trim();
            let items = db.items || [];
            if (query) {
                items = items.filter(i => (i.name || '').toLowerCase().includes(query));
            }
            if (masterAlphaFilter) {
                items = items.filter(i => (i.name || '').toUpperCase().startsWith(masterAlphaFilter));
            }
            const sortedItems = sortItemsAlphabetically(items);

            container.innerHTML = `
                <!-- Unified single sticky box containing tabs/search controls, opaque background, border boundary, overflow hidden -->
                <div class="sticky top-0 bg-stone-100 pt-3 px-1 pb-3 z-20 space-y-3 border-b border-stone-300 mb-4 overflow-hidden">
                    <div class="flex gap-2">
                        <button onclick="clearAlphaFilter('master')" class="bg-white hover:bg-stone-50 border-2 border-stone-300 text-stone-700 text-xs font-bold px-3 py-3 rounded-2xl transition shadow-xs cursor-pointer shrink-0">ALL</button>
                        <button onclick="toggleAlphaDrawer('master')" class="bg-white hover:bg-stone-50 border-2 border-stone-300 text-stone-700 text-xs font-bold px-3.5 py-3 rounded-2xl transition shadow-xs cursor-pointer shrink-0 flex items-center gap-1.5">
                            <i class="fa-solid fa-arrow-down-a-z text-xs"></i> A-Z ${masterAlphaFilter ? `(${masterAlphaFilter})` : ''}
                        </button>
                        <div class="relative flex-1">
                            <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-stone-400 text-xs"></i>
                            <input type="text" id="masterSearchInput" value="${escapeHtml(masterSearchQuery)}" oninput="masterSearchQuery=this.value; renderMasterListView(document.getElementById('mainContentArea')); document.getElementById('masterSearchInput').focus();" placeholder="Search full item list..." class="w-full bg-white border-2 border-stone-300 focus:border-stone-900 rounded-2xl pl-10 pr-4 py-3 text-sm text-stone-800 focus:outline-none transition shadow-none">
                            ${masterSearchQuery ? `<button onclick="masterSearchQuery=''; renderMasterListView(document.getElementById('mainContentArea'));" class="absolute right-3.5 top-3 text-stone-400 hover:text-stone-700 text-xs border border-stone-300 rounded px-1"><i class="fa-solid fa-xmark"></i></button>` : ''}
                        </div>
                        <button onclick="openItemDetailModal(null, null, masterSearchQuery)" class="bg-stone-900 hover:bg-black text-white text-xs font-bold px-4 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-md shrink-0 cursor-pointer">
                            <i class="fa-solid fa-plus text-[10px]"></i> New Item
                        </button>
                    </div>
                    ${showMasterAlphaDrawer ? renderAlphaDrawer('master') : ''}
                </div>
                ${sortedItems.length === 0 ? `
                    <div class="bg-white border-2 border-stone-300 rounded-3xl p-10 text-center shadow-xl space-y-3">
                        <p class="text-sm text-stone-500">No items found matching your filter.</p>
                        <button onclick="openItemDetailModal(null, null, masterSearchQuery)" class="bg-stone-900 hover:bg-black text-white text-xs font-bold px-5 py-2.5 rounded-2xl transition shadow-md cursor-pointer inline-flex items-center gap-2">
                            <i class="fa-solid fa-plus text-[10px]"></i> Create New Item
                        </button>
                    </div>
                ` : `<div class="space-y-3">${renderGroupedItemList(sortedItems, 'master')}</div>`}
            `;
            const input = document.getElementById('masterSearchInput');
            if (input && masterSearchQuery) {
                input.selectionStart = input.selectionEnd = input.value.length;
            }
        }

        function renderCategoriesManagementView(container) {
            const sortedCategories = [...(db.categories || [])].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            container.innerHTML = `
                <div class="pt-2">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-stone-500 uppercase tracking-wider">Total Categories: ${(db.categories || []).length}</span>
                        <button onclick="promptAddCategory()" class="bg-stone-900 hover:bg-black text-white text-xs font-bold px-4 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-md cursor-pointer">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add Category
                        </button>
                    </div>
                    <div class="space-y-2.5">
                        ${sortedCategories.length === 0 ? `<div class="bg-white border-2 border-stone-300 rounded-3xl p-10 text-center text-stone-400 text-sm shadow-xl">No categories added yet.</div>` : 
                            sortedCategories.map(cat => {
                                const originalIdx = db.categories.indexOf(cat);
                                return `
                                    <div class="bg-white border-2 border-stone-300 rounded-3xl p-3.5 shadow-md flex items-center justify-between hover:border-stone-400 transition gap-3">
                                        <div class="flex items-center gap-3 min-w-0 flex-1">
                                            <div class="w-9 h-9 rounded-2xl bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-700 shrink-0 font-bold"><i class="fa-solid fa-tag text-xs"></i></div>
                                            <h4 class="text-sm font-bold text-stone-900 truncate">${escapeHtml(cat)}</h4>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <button onclick="promptEditCategory(${originalIdx})" class="px-3.5 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-semibold transition cursor-pointer">Edit</button>
                                            <button onclick="confirmDeleteCategory(${originalIdx})" class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition cursor-pointer">Delete</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                    </div>
                </div>
            `;
        }

        function renderUnitsManagementView(container) {
            const sortedUnits = [...(db.units || [])].sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
            container.innerHTML = `
                <div class="pt-2">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-xs font-bold text-stone-500 uppercase tracking-wider">Total Units: ${(db.units || []).length}</span>
                        <button onclick="promptAddUnit()" class="bg-stone-900 hover:bg-black text-white text-xs font-bold px-4 py-2.5 rounded-2xl transition flex items-center gap-2 shadow-md cursor-pointer">
                            <i class="fa-solid fa-plus text-[10px]"></i> Add Unit
                        </button>
                    </div>
                    <div class="space-y-2.5">
                        ${sortedUnits.length === 0 ? `<div class="bg-white border-2 border-stone-300 rounded-3xl p-10 text-center text-stone-400 text-sm shadow-xl">No units added yet.</div>` : 
                            sortedUnits.map(unit => {
                                const originalIdx = db.units.indexOf(unit);
                                return `
                                    <div class="bg-white border-2 border-stone-300 rounded-3xl p-3.5 shadow-md flex items-center justify-between hover:border-stone-400 transition gap-3">
                                        <div class="flex items-center gap-3 min-w-0 flex-1">
                                            <div class="w-9 h-9 rounded-2xl bg-stone-100 border border-stone-200 flex items-center justify-center text-stone-700 shrink-0 font-bold"><i class="fa-solid fa-scale-balanced text-xs"></i></div>
                                            <h4 class="text-sm font-bold text-stone-900 truncate">${escapeHtml(unit)}</h4>
                                        </div>
                                        <div class="flex items-center gap-2 shrink-0">
                                            <button onclick="promptEditUnit(${originalIdx})" class="px-3.5 py-1.5 bg-stone-100 hover:bg-stone-200 text-stone-700 rounded-xl text-xs font-semibold transition cursor-pointer">Edit</button>
                                            <button onclick="confirmDeleteUnit(${originalIdx})" class="px-3.5 py-1.5 bg-rose-50 hover:bg-rose-100 text-rose-600 rounded-xl text-xs font-semibold transition cursor-pointer">Delete</button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                    </div>
                </div>
            `;
        }

        function renderStoreContainerView(container, storeId) {
            const storeItems = (db.items || []).filter(item => item.stores && item.stores.includes(storeId));

            const cartData = (db.carts || {})[storeId] || {};
            const cartItems = (db.items || []).filter(item => cartData[item.id] !== undefined);
            const sortedCartItems = sortCartItemsAlphabetically(cartItems, cartData);
            const hasCheckedItems = cartItems.some(i => cartData[i.id]?.checked);

            const query = storeSearchQuery.toLowerCase().trim();
            let displayItems = [];
            let isSearching = query.length > 0;
            
            if (isSearching) {
                displayItems = (db.items || []).filter(i => (i.name || '').toLowerCase().includes(query));
            } else {
                displayItems = storeItems;
                if (storeAlphaFilter) {
                    displayItems = displayItems.filter(i => (i.name || '').toUpperCase().startsWith(storeAlphaFilter));
                }
            }
            const sortedDisplayItems = sortItemsAlphabetically(displayItems);

            container.innerHTML = `
                <div class="space-y-4 pt-1">
                    ${storeSubTab === 'items' ? `
                        <div class="space-y-3">
                            ${sortedDisplayItems.length === 0 ? `
                                <div class="bg-white border-2 border-stone-300 rounded-3xl p-10 text-center shadow-xl space-y-3">
                                    <p class="text-sm text-stone-500">No items found matching your filter.</p>
                                    <button onclick="openItemDetailModal(null, '${storeId}', storeSearchQuery)" class="text-xs font-bold px-5 py-2.5 rounded-2xl transition shadow-md cursor-pointer inline-flex items-center gap-2 text-white" style="background-color: ${getStoreTheme(storeId).hex};">
                                        <i class="fa-solid fa-plus text-[10px]"></i> Create New Item
                                    </button>
                                </div>
                            ` : renderGroupedStoreItemList(sortedDisplayItems, storeId, isSearching)}
                        </div>
                    ` : `
                        <div class="flex items-center justify-between mb-3 flex-wrap gap-2">
                            <span class="text-xs font-bold text-stone-500 uppercase tracking-wider">Shopping List</span>
                            <div class="flex items-center gap-2">
                                ${hasCheckedItems ? `<button onclick="clearPurchasedItems('${storeId}')" class="text-xs text-stone-700 font-bold bg-white hover:bg-stone-50 border border-stone-200 px-3.5 py-2 rounded-xl transition shadow-xs cursor-pointer">Clear Purchased Items</button>` : ''}
                                ${cartItems.length > 0 ? `<button onclick="clearCart('${storeId}')" class="text-xs text-rose-600 font-bold bg-rose-50 hover:bg-rose-100 border border-stone-200 px-3.5 py-2 rounded-xl transition cursor-pointer">Clear ALL Items</button>` : ''}
                            </div>
                        </div>
                        <div class="space-y-3">
                            ${sortedCartItems.length === 0 ? `<div class="bg-white border-2 border-stone-300 rounded-3xl p-10 text-center text-stone-400 text-sm shadow-xl">Your shopping list is empty. Add items from the Store Items tab.</div>` : renderGroupedCartList(sortedCartItems, storeId, cartData)}
                        </div>
                    `}
                </div>
            `;
            const storeInput = document.getElementById('storeSearchInput');
            if (storeInput && storeSearchQuery) {
                storeInput.selectionStart = storeInput.selectionEnd = storeInput.value.length;
            }
        }

        function renderGroupedItemList(items, mode, storeId = null) {
            if (items.length === 0) return `<div class="bg-white border-2 border-stone-300 rounded-3xl p-8 text-center text-stone-400 text-sm">No items available.</div>`;
            const groups = {};
            items.forEach(item => {
                const cat = (item.category && item.category !== '') ? item.category : 'Uncategorized';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(item);
            });
            return Object.keys(groups).sort().map(category => `
                <div class="bg-white border-2 border-stone-300 rounded-3xl overflow-hidden shadow-xl mb-3">
                    <div class="bg-stone-200 px-4 py-2 border-b border-stone-300 text-xs font-extrabold uppercase tracking-wider text-stone-700 flex items-center justify-between">
                        <span>${escapeHtml(category)}</span>
                        <span class="text-[10px] font-semibold opacity-60">${groups[category].length} items</span>
                    </div>
                    <div class="divide-y divide-stone-100">${groups[category].map(item => renderItemRow(item, mode, storeId)).join('')}</div>
                </div>
            `).join('');
        }

        function renderGroupedStoreItemList(items, storeId, isSearching) {
            const groups = {};
            items.forEach(item => {
                const cat = (item.category && item.category !== '') ? item.category : 'Uncategorized';
                if (!groups[cat]) groups[cat] = [];
                groups[cat].push(item);
            });
            return Object.keys(groups).sort().map(category => `
                <div class="bg-white border-2 border-stone-300 rounded-3xl overflow-hidden shadow-xl mb-3">
                    <div class="bg-stone-200 px-4 py-2 border-b border-stone-300 text-xs font-extrabold uppercase tracking-wider text-stone-700 flex items-center justify-between">
                        <span>${escapeHtml(category)}</span>
                        <span class="text-[10px] font-semibold opacity-60">${groups[category].length} items</span>
                    </div>
                    <div class="divide-y divide-stone-100">${groups[category].map(item => {
                        const inStore = item.stores && item.stores.includes(storeId);
                        const mode = (isSearching && !inStore) ? 'search-add' : 'store';
                        return renderItemRow(item, mode, storeId);
                    }).join('')}</div>
                </div>
            `).join('');
        }

        function renderGroupedCartList(items, storeId, cartData) {
            if (items.length === 0) return `<div class="bg-white border-2 border-stone-300 rounded-3xl p-8 text-center text-stone-400 text-sm">No items available.</div>`;
            
            const activeItems = items.filter(i => !cartData[i.id]?.checked);
            const checkedItems = items.filter(i => cartData[i.id]?.checked);

            let html = '';

            if (activeItems.length > 0) {
                const activeGroups = {};
                activeItems.forEach(item => {
                    const cat = (item.category && item.category !== '') ? item.category : 'Uncategorized';
                    if (!activeGroups[cat]) activeGroups[cat] = [];
                    activeGroups[cat].push(item);
                });
                html += Object.keys(activeGroups).sort().map(category => `
                    <div class="bg-white border-2 border-stone-300 rounded-3xl overflow-hidden shadow-xl mb-3">
                        <div class="bg-stone-200 px-4 py-2 border-b border-stone-300 text-xs font-extrabold uppercase tracking-wider text-stone-700 flex items-center justify-between">
                            <span>${escapeHtml(category)}</span>
                            <span class="text-[10px] font-semibold opacity-60">${activeGroups[category].length} items</span>
                        </div>
                        <div class="divide-y divide-stone-100">${activeGroups[category].map(item => renderCartRow(item, storeId, cartData[item.id])).join('')}</div>
                    </div>
                `).join('');
            }

            if (checkedItems.length > 0) {
                const checkedGroups = {};
                checkedItems.forEach(item => {
                    const cat = (item.category && item.category !== '') ? item.category : 'Uncategorized';
                    if (!checkedGroups[cat]) checkedGroups[cat] = [];
                    checkedGroups[cat].push(item);
                });
                html += `<div class="text-[11px] font-bold uppercase tracking-wider text-stone-400 mt-4 mb-2">Purchased Items</div>`;
                html += Object.keys(checkedGroups).sort().map(category => `
                    <div class="bg-white border-2 border-stone-300 rounded-3xl overflow-hidden shadow-xl mb-3 opacity-75">
                        <div class="bg-stone-200 px-4 py-2 border-b border-stone-300 text-xs font-extrabold uppercase tracking-wider text-stone-700 flex items-center justify-between">
                            <span>${escapeHtml(category)} (Purchased)</span>
                            <span class="text-[10px] font-semibold opacity-60">${checkedGroups[category].length} items</span>
                        </div>
                        <div class="divide-y divide-stone-100">${checkedGroups[category].map(item => renderCartRow(item, storeId, cartData[item.id])).join('')}</div>
                    </div>
                `).join('');
            }

            return html;
        }

        function renderItemRow(item, mode, storeId) {
            let rightSideHTML = '', leftSideHTML = '';
            
            let effectiveBrand = item.brandOrder && item.brandOrder.length > 0 ? item.brandOrder[0] : (item.brand || '');
            let effectiveNotes = item.notes || '';

            if (storeId && item.customizeByStore && item.storeCustomizations && item.storeCustomizations[storeId]) {
                const custom = item.storeCustomizations[storeId];
                if (custom.brandOrder && custom.brandOrder.length > 0 && custom.brandOrder[0]) {
                    effectiveBrand = custom.brandOrder[0];
                }
                if (custom.notes !== undefined && custom.notes !== '') {
                    effectiveNotes = custom.notes;
                }
            }

            const unitStr = item.unit ? `(${escapeHtml(item.unit)})` : '';
            const theme = storeId ? getStoreTheme(storeId) : null;

            if (mode === 'store') {
                if (!storeItemQuantities[storeId]) storeItemQuantities[storeId] = {};
                const cartData = (db.carts || {})[storeId] || {};
                const inCart = cartData[item.id] !== undefined;
                
                if (storeItemQuantities[storeId][item.id] === undefined) {
                    storeItemQuantities[storeId][item.id] = inCart ? cartData[item.id].quantity : 1;
                }
                const currentQty = storeItemQuantities[storeId][item.id];

                leftSideHTML = `<button onclick="confirmDeleteStoreItem('${item.id}', '${storeId}')" class="text-stone-400 hover:text-rose-600 p-1.5 border border-stone-300 rounded-xl transition cursor-pointer" title="Remove from store list"><i class="fa-solid fa-xmark text-sm font-bold"></i></button>`;
                
                const cartBtnStyle = inCart 
                    ? `background-color: ${theme.hex}; color: #ffffff;` 
                    : `background-color: #f5f5f4; color: #a8a29e; border: 1px solid #e7e5e4;`;

                rightSideHTML = `
                    <div class="flex items-center gap-2">
                        <div class="flex items-center bg-stone-100 rounded-xl border border-stone-200 overflow-hidden shadow-inner">
                            <button onclick="adjustStoreItemQty('${item.id}', '${storeId}', -1)" class="w-7 h-7 flex items-center justify-center text-stone-600 hover:bg-stone-200 text-xs font-bold cursor-pointer">-</button>
                            <span class="w-7 text-center text-xs font-bold text-stone-700">${currentQty}</span>
                            <button onclick="adjustStoreItemQty('${item.id}', '${storeId}', 1)" class="w-7 h-7 flex items-center justify-center text-stone-600 hover:bg-stone-200 text-xs font-bold cursor-pointer">+</button>
                        </div>
                        <button onclick="toggleCartItem('${item.id}', '${storeId}')" class="w-9 h-9 rounded-xl flex items-center justify-center transition shadow-xs cursor-pointer" style="${cartBtnStyle}"><i class="fa-solid fa-cart-shopping text-xs"></i></button>
                    </div>`;
            } else if (mode === 'search-add') {
                leftSideHTML = `<div class="w-7 flex justify-center text-stone-300"><i class="fa-solid fa-plus text-xs"></i></div>`;
                rightSideHTML = `
                    <button onclick="addMasterItemToStore('${item.id}', '${storeId}')" class="text-xs font-bold px-3.5 py-2 rounded-xl transition shadow-xs cursor-pointer text-white" style="background-color: ${theme.hex};">
                        Add to Store
                    </button>`;
            } else {
                leftSideHTML = `<button onclick="confirmDeleteMasterItem('${item.id}')" class="text-stone-400 hover:text-rose-600 p-1.5 border border-stone-300 rounded-xl transition cursor-pointer" title="Delete item globally"><i class="fa-solid fa-trash text-sm"></i></button>`;
                const assignedStores = (item.stores || []).map(sid => (db.stores.find(st => st.id === sid) || {}).name).filter(Boolean).join(', ');
                rightSideHTML = `<span class="text-xs font-semibold text-stone-600 truncate max-w-[140px] bg-stone-100 px-3 py-1.5 rounded-xl border border-stone-200">${assignedStores || 'No stores'}</span>`;
            }

            return `
                <div class="flex items-center justify-between px-3.5 py-2.5 hover:bg-stone-50/80 transition gap-2">
                    <div class="flex items-center gap-2.5 min-w-0 flex-1">
                        ${leftSideHTML}
                        <div class="min-w-0 flex-1 cursor-pointer" onclick="openItemDetailModal('${item.id}')">
                            <h4 class="text-sm font-bold text-stone-900 truncate">
                                ${escapeHtml(item.name)} ${unitStr ? `<span class="text-xs font-normal text-stone-500">${unitStr}</span>` : ''}
                            </h4>
                            ${effectiveBrand ? `<p class="text-xs text-stone-500 truncate mt-0.5">${escapeHtml(effectiveBrand)}</p>` : ''}
                        </div>
                    </div>
                    ${rightSideHTML}
                </div>`;
        }

        function addMasterItemToStore(itemId, storeId) {
            const item = db.items.find(i => i.id === itemId);
            if (item) {
                if (!item.stores) item.stores = [];
                if (!item.stores.includes(storeId)) {
                    item.stores.push(storeId);
                    storeSearchQuery = '';
                    saveLocalData();
                    renderAll();
                }
            }
        }

        function renderCartRow(item, storeId, cartEntry) {
            const checked = cartEntry ? cartEntry.checked : false;
            const qty = cartEntry ? cartEntry.quantity : 1;
            
            let effectiveBrand = item.brandOrder && item.brandOrder.length > 0 ? item.brandOrder[0] : (item.brand || '');
            let effectiveNotes = item.notes || '';

            if (item.customizeByStore && item.storeCustomizations && item.storeCustomizations[storeId]) {
                const custom = item.storeCustomizations[storeId];
                if (custom.brandOrder && custom.brandOrder.length > 0 && custom.brandOrder[0]) {
                    effectiveBrand = custom.brandOrder[0];
                }
                if (custom.notes !== undefined && custom.notes !== '') {
                    effectiveNotes = custom.notes;
                }
            }

            const unitName = item.unit ? escapeHtml(item.unit) : '-';
            const itemNote = effectiveNotes ? effectiveNotes.trim() : '';
            const theme = getStoreTheme(storeId);

            const checkboxStyle = checked 
                ? `background-color: ${theme.hex}; border-color: ${theme.hex}; color: #ffffff;` 
                : `background-color: #f5f5f4; border-color: ${theme.hex}; color: transparent;`;

            const unitLength = unitName.length;
            const unitFontSizeClass = unitLength > 5 ? 'text-[10px]' : 'text-xs';

            return `
                <div class="flex items-center justify-between px-2.5 py-1 hover:bg-stone-50/80 transition gap-1.5 ${checked ? 'opacity-45 bg-stone-100/50' : ''}">
                    <div class="flex items-center gap-1.5 min-w-0 flex-1">
                        <button onclick="confirmDeleteCartItem('${item.id}', '${storeId}')" class="text-stone-400 hover:text-rose-600 p-0.5 border border-stone-300 rounded-md transition cursor-pointer" title="Remove from shopping list"><i class="fa-solid fa-xmark text-xs font-bold"></i></button>
                        <div class="min-w-0 flex-1 cursor-pointer" onclick="openReadOnlyItemModal('${item.id}', '${storeId}')">
                            <h4 class="text-xs font-bold truncate leading-tight ${checked ? 'line-through text-stone-400' : 'text-stone-900'}">
                                ${escapeHtml(item.name)}
                            </h4>
                            ${effectiveBrand ? `<p class="text-[10px] text-stone-500 truncate leading-none mt-0.5">${escapeHtml(effectiveBrand)}</p>` : ''}
                            ${itemNote ? `<p class="text-[10px] text-stone-500 truncate leading-none mt-0.5">${escapeHtml(itemNote)}</p>` : ''}
                        </div>
                    </div>
                    <div class="flex items-center gap-1 shrink-0">
                        <!-- Ultra-minimized padding container: height matches checkbox (w-7 h-7 / 28px), unit cell set to w-16 -->
                        <div class="flex h-7 bg-stone-100 border border-stone-300 rounded-lg overflow-hidden shadow-inner text-center">
                            <!-- Qty field using Tailwind width class w-10 -->
                            <div class="h-full border-r border-stone-300 flex flex-col shrink-0 justify-center w-10">
                                <div class="text-[7px] font-bold uppercase tracking-wider text-stone-500 leading-none">Qty</div>
                                <div class="flex items-center justify-center mt-0.5">
                                    <div class="text-[11px] font-normal text-stone-900 leading-none">${qty}</div>
                                </div>
                            </div>
                            <!-- Unit field using Tailwind width class w-16 -->
                            <div class="h-full flex flex-col shrink-0 justify-center w-16">
                                <div class="text-[7px] font-bold uppercase tracking-wider text-stone-500 leading-none">Unit</div>
                                <div class="flex items-center justify-center mt-0.5 px-0.5">
                                    <div class="${unitFontSizeClass} font-normal text-stone-900 leading-none truncate w-full">${unitName}</div>
                                </div>
                            </div>
                        </div>
                        <button onclick="toggleCartCheck('${item.id}', '${storeId}')" class="w-7 h-7 rounded-lg border-2 flex items-center justify-center transition shadow-xs cursor-pointer shrink-0" style="${checkboxStyle}"><i class="fa-solid fa-check text-[10px]"></i></button>
                    </div>
                </div>`;
        }

        // --- STORE CARD MODAL MANAGEMENT ---
        let editingStoreId = null;

        function openStoreCardModal(storeId) {
            editingStoreId = storeId;
            const isNew = !storeId;
            const modal = document.getElementById('storeCardModal');
            const titleEl = document.getElementById('storeCardModalTitle');
            const bodyEl = document.getElementById('storeCardModalBody');
            const saveBtn = document.getElementById('storeCardSaveBtn');

            titleEl.textContent = isNew ? 'Create New Store' : 'Edit Store Settings';

            let store = isNew ? { name: '', themeColor: 'red' } : JSON.parse(JSON.stringify(db.stores.find(s => s.id === storeId)));
            if (!store) return;

            bodyEl.innerHTML = `
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-1.5">Store Name *</label>
                    <input type="text" id="storeCardName" value="${escapeHtml(store.name)}" class="w-full bg-stone-50 border-2 border-stone-300 rounded-2xl px-4 py-3 text-sm text-stone-800 focus:outline-none focus:border-stone-900 transition" placeholder="e.g. Whole Foods">
                </div>
                <div>
                    <label class="block text-[11px] font-bold uppercase tracking-wider text-stone-500 mb-2">Select Theme Color</label>
                    <div class="grid grid-cols-2 gap-2 max-h-52 overflow-y-auto p-2 bg-stone-50 border border-stone-200 rounded-2xl">
                        ${sophisticatedColors.map(c => `
                            <button type="button" onclick="selectStoreColor('${c.value}')" class="store-color-option flex items-center gap-3 p-2.5 rounded-xl border transition cursor-pointer ${store.themeColor === c.value ? 'border-stone-900 bg-white shadow-md ring-2 ring-stone-900/20 font-bold' : 'border-stone-200 bg-white hover:bg-stone-50'}" data-color="${c.value}">
                                <span class="w-6 h-6 rounded-full shrink-0 shadow-xs border border-black/10" style="background-color: ${c.hex};"></span>
                                <span class="text-xs text-stone-800 font-medium text-left truncate">${c.name}</span>
                            </button>
                        `).join('')}
                    </div>
                </div>
            `;

            const currentTheme = sophisticatedColors.find(c => c.value === store.themeColor) || sophisticatedColors[0];
            saveBtn.style.backgroundColor = currentTheme.hex;
            saveBtn.onclick = () => saveStoreCard(storeId);

            modal.classList.remove('hidden');
        }

        function selectStoreColor(colorVal) {
            document.querySelectorAll('.store-color-option').forEach(btn => {
                if (btn.getAttribute('data-color') === colorVal) {
                    btn.className = "store-color-option flex items-center gap-3 p-2.5 rounded-xl border border-stone-900 bg-white shadow-md ring-2 ring-stone-900/20 font-bold transition cursor-pointer";
                } else {
                    btn.className = "store-color-option flex items-center gap-3 p-2.5 rounded-xl border border-stone-200 bg-white hover:bg-stone-50 transition cursor-pointer";
                }
            });
            const found = sophisticatedColors.find(c => c.value === colorVal);
            const saveBtn = document.getElementById('storeCardSaveBtn');
            if (found) {
                saveBtn.style.backgroundColor = found.hex;
            }
            saveBtn.setAttribute('data-selected-color', colorVal);
        }

        function closeStoreCardModal() {
            document.getElementById('storeCardModal').classList.add('hidden');
            editingStoreId = null;
        }

        function saveStoreCard(storeId) {
            const nameInput = document.getElementById('storeCardName');
            const name = nameInput ? nameInput.value.trim() : '';
            if (!name) {
                alert('Store name is required.');
                return;
            }

            const saveBtn = document.getElementById('storeCardSaveBtn');
            let colorVal = saveBtn.getAttribute('data-selected-color');
            if (!colorVal) {
                const activeBtn = document.querySelector('.store-color-option.border-stone-900');
                colorVal = activeBtn ? activeBtn.getAttribute('data-color') : 'red';
            }

            if (storeId) {
                const store = db.stores.find(s => s.id === storeId);
                if (store) {
                    store.name = name;
                    store.themeColor = colorVal;
                }
            } else {
                const newStore = { id: 's_' + Date.now(), name, themeColor: colorVal };
                db.stores.push(newStore);
                activeStoreId = newStore.id;
                activeView = 'store';
                storeSubTab = 'items';
            }

            saveLocalData();
            closeStoreCardModal();
            renderAll();
        }

        // --- MANAGE STORES MODAL ---
        function openManageStoresModal() {
            const modal = document.getElementById('manageStoresModal');
            renderManageStoresList();
            modal.classList.remove('hidden');
        }

        function closeManageStoresModal() {
            document.getElementById('manageStoresModal').classList.add('hidden');
            renderAll();
        }

        function renderManageStoresList() {
            const bodyEl = document.getElementById('manageStoresBody');
            if (!bodyEl) return;
            if (db.stores.length === 0) {
                bodyEl.innerHTML = `<p class="text-xs text-stone-500 italic py-2 text-center">No stores available.</p>`;
                return;
            }
            bodyEl.innerHTML = db.stores.map((store, idx) => {
                const theme = getStoreTheme(store.id);
                return `
                    <div class="bg-stone-50 border-2 border-stone-200 rounded-2xl p-3.5 space-y-3">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2.5 flex-1 min-w-0">
                                <span class="w-4 h-4 rounded-full shrink-0 shadow-xs border border-black/10" style="background-color: ${theme.hex};"></span>
                                <input type="text" id="manageStoreName_${store.id}" value="${escapeHtml(store.name)}" onchange="updateStoreNameInline('${store.id}', this.value)" class="w-full bg-white border border-stone-300 rounded-xl px-3 py-1.5 text-sm font-bold text-stone-900 focus:outline-none focus:border-stone-900 transition">
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="moveStoreOrder(${idx}, -1)" ${idx === 0 ? 'disabled class="opacity-20 cursor-not-allowed"' : ''} class="w-8 h-8 bg-white border border-stone-300 rounded-xl text-xs text-stone-700 transition cursor-pointer flex items-center justify-center"><i class="fa-solid fa-arrow-up"></i></button>
                                <button onclick="moveStoreOrder(${idx}, 1)" ${idx === db.stores.length - 1 ? 'disabled class="opacity-20 cursor-not-allowed"' : ''} class="w-8 h-8 bg-white border border-stone-300 rounded-xl text-xs text-stone-700 transition cursor-pointer flex items-center justify-center"><i class="fa-solid fa-arrow-down"></i></button>
                            </div>
                        </div>
                        <div class="flex items-center justify-between gap-2 pt-1 border-t border-stone-200">
                            <span class="text-[11px] font-bold text-stone-500 uppercase tracking-wider">Color Theme</span>
